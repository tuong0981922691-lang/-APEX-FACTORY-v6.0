<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;scrollbar-width:none;font-family:var(--font-ui)}*::-webkit-scrollbar{display:none}html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);color:var(--text)}body{display:flex;justify-content:center;align-items:center}.app-shell{width:100%;height:100%;position:relative;background:radial-gradient(circle at 50% -20%,rgba(90,56,34,.55) 0%,rgba(28,18,12,.88) 38%,var(--bg-deep) 86%),linear-gradient(180deg,var(--brown-2),var(--brown-0));overflow:hidden;display:flex;flex-direction:column}.app-shell::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 8%,rgba(245,158,11,.10),transparent 28%),radial-gradient(circle at 88% 18%,rgba(217,119,6,.08),transparent 30%),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(180deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:auto,auto,34px 34px,34px 34px;opacity:.72;z-index:0}.space-nav{position:relative;z-index:80;flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 8px calc(env(safe-area-inset-left) + 10px);display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,rgba(58,36,22,.96),rgba(19,13,9,.92)),radial-gradient(circle at 10% 0%,rgba(250,204,21,.16),transparent 36%);border-bottom:1px solid rgba(245,158,11,.34);box-shadow:0 14px 32px rgba(0,0,0,.52);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.space-back-btn{min-height:38px;padding:0 14px;border:1px solid rgba(250,204,21,.42);border-radius:12px;background:linear-gradient(145deg,rgba(42,25,15,.96),rgba(19,13,9,.96));color:var(--cream);font-size:12px;font-weight:950;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px rgba(0,0,0,.48),inset 0 1px 1px rgba(255,255,255,.08)}.space-title{flex:1;min-width:0;text-align:right;font-size:11px;font-weight:900;letter-spacing:1px;color:rgba(248,241,231,.72);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st-content{position:relative;z-index:1;flex:1;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column;overflow:hidden;min-height:0}.st-card{background:transparent;border:none;overflow:hidden;position:relative;display:flex;flex-direction:column;flex:1;min-height:0}.st-matrix-toggle{display:flex;gap:6px;padding:10px 6px;background:linear-gradient(90deg,rgba(58,36,22,.72),rgba(91,55,28,.32),rgba(58,36,22,.72));border-bottom:1px solid rgba(245,158,11,.34);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:3}.st-mode-btn{flex:1;padding:13px 7px;border-radius:8px;background:linear-gradient(145deg,rgba(19,13,9,.92),rgba(42,25,15,.86));border:1px solid rgba(248,241,231,.10);color:rgba(248,241,231,.54);font-weight:900;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.25s;box-shadow:4px 4px 10px rgba(0,0,0,.46),inset 0 1px 1px rgba(255,255,255,.04)}.st-mode-btn.active{color:#fff;border-color:var(--yellow);background:linear-gradient(135deg,rgba(250,204,21,.24),rgba(146,64,14,.58));box-shadow:0 0 22px rgba(250,204,21,.55),inset 0 0 12px rgba(250,204,21,.24);text-shadow:0 0 10px rgba(250,204,21,.75);transform:translateY(-1px)}.range-bar{display:flex;align-items:center;gap:8px;padding:8px 8px;background:rgba(7,4,3,.72);border-bottom:1px solid rgba(245,158,11,.22);z-index:3}.range-btn{height:28px;padding:0 9px;border-radius:999px;border:1px solid rgba(250,204,21,.34);background:rgba(42,25,15,.82);color:#fef3c7;font-size:10px;font-weight:950;white-space:nowrap}.range-btn.active{background:var(--yellow);color:#130d09;border-color:var(--yellow);box-shadow:0 0 14px rgba(250,204,21,.42)}.scroll-hint{flex:1;min-width:0;color:#b89f85;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}.st-matrix-container{position:relative;flex:1;overflow:auto;outline:none;cursor:grab;-webkit-overflow-scrolling:touch;min-height:0;overscroll-behavior:contain;touch-action:pan-x pan-y}.st-matrix-container:active{cursor:grabbing}.st-matrix-table{border-collapse:separate;border-spacing:0;width:max-content;table-layout:fixed;transition:opacity .35s}.st-matrix-table th,.st-matrix-table td{width:30px;min-width:30px;height:30px;border-right:1px solid rgba(184,159,133,.08);border-bottom:1px solid rgba(184,159,133,.08);text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);position:relative;transition:.2s;white-space:nowrap!important}.st-matrix-table.day-100 th,.st-matrix-table.day-100 td{width:31px;min-width:31px}.st-matrix-table.day-90 th,.st-matrix-table.day-90 td{width:32px;min-width:32px}.st-matrix-table.pair-mode .st-corner-btn{min-width:62px!important;width:auto!important;padding:0 5px!important}.st-matrix-table tr:hover td{background:rgba(245,158,11,.055);color:#fff}.st-matrix-table thead th{position:sticky;top:0;z-index:2;background:rgba(28,18,12,.96);color:#fbbf24;font-weight:900;text-shadow:0 0 5px rgba(245,158,11,.34);backdrop-filter:blur(4px)}.st-corner{position:sticky;top:0;left:0;z-index:20!important;background:#050302!important;color:#fff!important}.st-corner-btn{position:sticky;left:0;z-index:15;background:rgba(13,8,5,.97);color:#fff;cursor:pointer;font-size:13px!important;font-weight:900!important;box-shadow:4px 0 10px rgba(0,0,0,.50);backdrop-filter:blur(4px);overflow:visible!important}.st-corner-btn:hover{color:var(--yellow);text-shadow:0 0 8px var(--yellow);background:#1c120c}.st-row-badge{position:absolute;right:-6px;top:-6px;font-size:7px;padding:2px 5px;border-radius:8px;z-index:25;font-weight:900;white-space:nowrap;box-shadow:0 4px 8px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.18);pointer-events:none}.st-badge-gan{background:linear-gradient(135deg,#ef4444,#991b1b);color:#fff;animation:pulseGan 1.3s infinite alternate}.st-badge-hot{background:linear-gradient(135deg,#facc15,#b45309);color:#000}@keyframes pulseGan{0%{box-shadow:0 0 5px rgba(239,68,68,.32);transform:scale(.96)}100%{box-shadow:0 0 15px rgba(239,68,68,.75);transform:scale(1.05)}}.st-row-laser{position:absolute;left:0;height:2px;width:0;background:#fff;box-shadow:0 0 10px #fff,0 0 20px var(--yellow),0 0 38px var(--amber);z-index:30;opacity:0;border-radius:999px;pointer-events:none}.st-row-laser.fire{animation:rowSweep 1.5s cubic-bezier(.25,.46,.45,.94) forwards}@keyframes rowSweep{0%{width:0;opacity:1;left:30px}50%{width:250px;opacity:1}100%{left:100%;width:0;opacity:0}}.st-row-analyzed td{border-top:1px solid rgba(245,158,11,.34);border-bottom:1px solid rgba(245,158,11,.34);background-color:rgba(245,158,11,.045)}.st-highlight-gap{background:rgba(239,68,68,.15)!important;color:rgba(239,68,68,.62)!important;border-top:1px solid rgba(239,68,68,.46)!important;border-bottom:1px solid rgba(239,68,68,.46)!important}.st-highlight-hit{background:rgba(16,185,129,.20)!important;color:#10b981!important;text-shadow:0 0 10px #10b981;font-size:16px!important;font-weight:900!important;border:1px solid var(--green)!important;position:relative;border-radius:4px;box-shadow:inset 0 0 15px rgba(16,185,129,.22);z-index:2}.st-highlight-hit::before{content:"🎯";position:absolute;top:-12px;right:-10px;font-size:16px;animation:pinDrop .58s cubic-bezier(.175,.885,.32,1.275) forwards}.st-highlight-hit::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;margin-top:-17px;margin-left:-17px;border:2px solid var(--green);border-radius:50%;animation:hitRipple 1.5s cubic-bezier(.165,.84,.44,1) infinite}@keyframes pinDrop{0%{transform:translateY(-25px) scale(2.5) rotate(-20deg);opacity:0}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}@keyframes hitRipple{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.5);opacity:0;border-width:0}}.st-hud{position:absolute;top:0;left:0;width:100%;z-index:50;transform:translateY(-100%);transition:transform .42s cubic-bezier(.175,.885,.32,1.275);padding:15px 15px 12px;text-align:center;color:#fff;border-bottom:1px solid rgba(255,255,255,.14);box-shadow:0 18px 36px rgba(0,0,0,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:10px;border-radius:0 0 16px 16px}.st-hud.show{transform:translateY(0)}.st-hud .eval{align-self:center;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08)}.st-hud .hl-num,.st-hud .hl-count{font-size:18px;font-weight:900}.st-tier-diamond{background:linear-gradient(180deg,rgba(14,165,233,.22),rgba(7,4,3,.95));border-color:rgba(56,189,248,.46)}.st-tier-gold{background:linear-gradient(180deg,rgba(245,158,11,.24),rgba(7,4,3,.95));border-color:rgba(250,204,21,.46)}.st-tier-silver{background:linear-gradient(180deg,rgba(148,163,184,.22),rgba(7,4,3,.95));border-color:rgba(148,163,184,.46)}.st-tier-bronze{background:linear-gradient(180deg,rgba(217,119,6,.24),rgba(7,4,3,.95));border-color:rgba(245,158,11,.46)}.screen-flash{animation:screenFlash .55s ease}@keyframes screenFlash{0%{box-shadow:inset 0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:inset 0 0 0 999px rgba(245,158,11,.06)}100%{box-shadow:inset 0 0 0 0 rgba(245,158,11,0)}}.js-ripple{position:relative;overflow:hidden}.js-ripple .ripple{position:absolute;border-radius:50%;transform:scale(0);animation:ripple .6s linear;background:rgba(255,255,255,.28);pointer-events:none}@keyframes ripple{to{transform:scale(4);opacity:0}}@media(max-width:390px){.st-mode-btn{font-size:9.5px;padding:12px 6px}.space-title{font-size:10px}.range-btn{font-size:9px;padding:0 8px}.scroll-hint{font-size:9px}.st-matrix-table.day-100 th,.st-matrix-table.day-100 td{width:30px;min-width:30px}}

<body>
<div class="app-shell" id="app-shell">
<nav class="space-nav" aria-label="Điều hướng không gian"><button class="space-back-btn js-ripple" id="space-back-btn" type="button" aria-label="Trở về không gian trước"><span aria-hidden="true">←</span><span>TRỞ VỀ</span></button><div class="space-title" id="space-title">MA TRẬN 100 NGÀY</div></nav>
<div class="st-content"><div class="st-card" id="st-slider-viewport"><div id="st-hud" class="st-hud"><div class="eval" id="st-hud-eval">XẾP HẠNG</div><div id="st-hud-text">Phân tích nhịp lô...</div></div><div class="st-matrix-toggle"><button class="st-mode-btn active js-ripple" data-st-mode="single" type="button">LÔ ĐƠN</button><button class="st-mode-btn js-ripple" data-st-mode="pair" type="button">LÔ CẶP</button><button class="st-mode-btn js-ripple" data-st-mode="double" type="button">LÔ KÉP</button></div><div class="range-bar"><button class="range-btn js-ripple" data-days="90" type="button">90 NGÀY</button><button class="range-btn active js-ripple" data-days="100" type="button">100 NGÀY</button><div class="scroll-hint" id="scroll-hint">Kéo ngang hoặc vuốt trái/phải để xem đủ ngày.</div></div><div class="st-matrix-container" id="st-matrix-container" tabindex="0"><div class="st-row-laser" id="st-row-laser"></div><table class="st-matrix-table day-100" id="st-matrix-table"><thead id="st-matrix-head"></thead><tbody id="st-matrix-body"></tbody></table></div></div></div>
</div>
<script>
"use strict";const $=id=>document.getElementById(id);const $$=(sel,root=document)=>Array.from(root.querySelectorAll(sel));const App={flash(el){if(!el)return;el.classList.remove("screen-flash");void el.offsetWidth;el.classList.add("screen-flash");setTimeout(()=>el.classList.remove("screen-flash"),560)}};
function initSpaceBackButton(){const backButton=$("space-back-btn");if(!backButton)return;backButton.addEventListener("click",()=>{const returnEvent=new CustomEvent("space:return",{bubbles:true,composed:true,detail:{from:"matrix-100-days",action:"return"}});window.dispatchEvent(returnEvent);document.dispatchEvent(returnEvent);if(window.history.length>1){window.history.back();return}if(window.location.hash!=="#home")window.location.hash="home"})}
document.addEventListener("click",e=>{const t=e.target.closest(".js-ripple");if(!t)return;const r=t.getBoundingClientRect();const c=document.createElement("span");const d=Math.max(r.width,r.height);c.className="ripple";c.style.width=c.style.height=d+"px";c.style.left=e.clientX-r.left-d/2+"px";c.style.top=e.clientY-r.top-d/2+"px";t.appendChild(c);setTimeout(()=>c.remove(),620)});
const MatrixEngine=(()=>{const state={matrixData:{},matrixNumMap:{},currentAnalyzedNum:"",hudTimeout:null,currentMode:"single",daysCount:100};function seededHit(row,day,mode){const base=Math.sin((row+1)*97.37+(day+1)*31.17+(mode.length*13.91))*10000;const v=base-Math.floor(base);if(v>.86)return String(Math.floor((v-.86)/.14*4)+1);return""}function initMatrixHead(){const th=$("st-matrix-head");let h='<tr><th class="st-corner">Lô</th>';for(let d=1;d<=state.daysCount;d++)h+=`<th>${d}</th>`;h+="</tr>";th.innerHTML=h;$("space-title").textContent=`MA TRẬN ${state.daysCount} NGÀY`;$("st-matrix-table").classList.toggle("day-90",state.daysCount===90);$("st-matrix-table").classList.toggle("day-100",state.daysCount===100);$$('[data-days]').forEach(b=>b.classList.toggle('active',Number(b.getAttribute('data-days'))===state.daysCount))}function getMatrixItems(m){const it=[];if(m==="single"){for(let i=0;i<=99;i++)it.push(String(i).padStart(2,"0"))}else if(m==="pair"){for(let i=0;i<=8;i++)for(let j=i+1;j<=9;j++)it.push(`${i}${j}-${j}${i}`);it.push("00-55","11-66","22-77","33-88","44-99")}else{["00","11","22","33","44","55","66","77","88","99"].forEach(v=>it.push(v))}return it}function renderMatrixData(m){const tb=$("st-matrix-body");const it=getMatrixItems(m);state.matrixData={};state.matrixNumMap={};let h="";it.forEach((num,ri)=>{const days=[];for(let j=0;j<state.daysCount;j++)days.push(seededHit(ri,j,m));state.matrixData[ri]=days;state.matrixNumMap[num]=ri;let currentGap=0;while(currentGap<state.daysCount&&days[currentGap]==="")currentGap++;let maxHitsInDay=currentGap===0&&days[0]!==""?parseInt(days[0],10):0;let badge="";if(currentGap>=10)badge=`<span class="st-row-badge st-badge-gan">Gan ${currentGap}</span>`;else if(maxHitsInDay>=2)badge=`<span class="st-row-badge st-badge-hot">🔥 ${maxHitsInDay} nháy</span>`;h+=`<tr id="st-row-${ri}"><th id="st-th-${ri}" class="st-corner-btn" data-row-idx="${ri}" data-num="${num}">${num}${badge}</th>`;days.forEach((v,ci)=>{h+=`<td id="st-cell-${ri}-${ci}" data-day="${ci+1}" data-nhay="${v}">${v}</td>`});h+="</tr>"});tb.innerHTML=h;$("scroll-hint").textContent=`Đang xem ${state.daysCount} ngày · vuốt trái/phải hoặc kéo ngang để xem toàn bộ cột.`}function clearAnalysisState(){ $$("#st-matrix-body tr").forEach(tr=>tr.classList.remove("st-row-analyzed"));$$("#st-matrix-body td").forEach(td=>td.classList.remove("st-highlight-gap","st-highlight-hit"));$("st-hud").className="st-hud";$("st-row-laser").classList.remove("fire");if(state.hudTimeout)clearTimeout(state.hudTimeout)}function switchMatrixMode(m){state.currentMode=m;clearAnalysisState();const t=$("st-matrix-table");t.classList.remove("pair-mode","double-mode");if(m==="pair")t.classList.add("pair-mode");if(m==="double")t.classList.add("double-mode");$$('[data-st-mode]').forEach(b=>b.classList.toggle('active',b.getAttribute('data-st-mode')===m));const tb=$("st-matrix-body");tb.style.opacity="0";setTimeout(()=>{renderMatrixData(m);tb.style.opacity="1";const s=$("st-matrix-container");s.scrollTop=0;s.scrollLeft=0},160)}function setDaysCount(days){const v=Number(days);if(v!==90&&v!==100)return;state.daysCount=v;clearAnalysisState();initMatrixHead();switchMatrixMode(state.currentMode)}function triggerRowAnalysis(num,ri){const days=state.matrixData[ri];if(!days)return;state.currentAnalyzedNum=num;clearAnalysisState();const row=$(`st-row-${ri}`);const th=$(`st-th-${ri}`);const banner=$("st-hud");const laser=$("st-row-laser");let currentGap=0;while(currentGap<state.daysCount&&days[currentGap]==="")currentGap++;let metaData=[];let rhythmCount=0;if(currentGap>0){let emptyCount=0;let tempIndices=[];for(let j=currentGap+1;j<state.daysCount;j++){if(days[j]===""){emptyCount++;tempIndices.push(j)}else{if(emptyCount===currentGap){rhythmCount++;tempIndices.forEach(c=>metaData.push({c,t:"gap"}));metaData.push({c:j-emptyCount-1,t:"hit"})}emptyCount=0;tempIndices=[]}}}if(currentGap===0)rhythmCount=99;if(th){laser.style.top=th.offsetTop+14+"px";void laser.offsetWidth;laser.classList.add("fire")}if(row)row.classList.add("st-row-analyzed");const tierClass=rhythmCount>=3?"st-tier-diamond":rhythmCount===2?"st-tier-gold":rhythmCount===1?"st-tier-silver":"st-tier-bronze";setTimeout(()=>{metaData.forEach(m=>{const c=$(`st-cell-${ri}-${m.c}`);if(c)c.classList.add(m.t==="gap"?"st-highlight-gap":"st-highlight-hit")});const evalText=tierClass==="st-tier-diamond"?"💎 KIM CƯƠNG":tierClass==="st-tier-gold"?"🏆 VÀNG":tierClass==="st-tier-silver"?"🥈 BẠC":"🪨 ĐỒNG";$("st-hud-eval").textContent=evalText;if(currentGap===0){$("st-hud-text").innerHTML=`Lô <span class="hl-num">${num}</span>: VỪA NỔ NGÀY QUA.`}else{$("st-hud-text").innerHTML=`Lô <span class="hl-num">${num}</span>: Nhịp nghỉ <span class="hl-num">${currentGap}</span> ngày. Quét ${state.daysCount} ngày: <span class="hl-count">${rhythmCount}</span> lần rơi trùng nhịp.`}banner.className=`st-hud ${tierClass} show`},320);state.hudTimeout=setTimeout(clearAnalysisState,8000)}function initDragToScroll(){const sl=$("st-matrix-container");let isDown=false,startX=0,startY=0,scrollLeft=0,scrollTop=0;sl.addEventListener("touchstart",()=>clearAnalysisState(),{passive:true});sl.addEventListener("mousedown",e=>{clearAnalysisState();isDown=true;startX=e.pageX-sl.offsetLeft;startY=e.pageY-sl.offsetTop;scrollLeft=sl.scrollLeft;scrollTop=sl.scrollTop;sl.style.cursor="grabbing"});sl.addEventListener("mouseleave",()=>{isDown=false;sl.style.cursor="grab"});sl.addEventListener("mouseup",()=>{isDown=false;sl.style.cursor="grab"});sl.addEventListener("mousemove",e=>{if(!isDown)return;e.preventDefault();const x=e.pageX-sl.offsetLeft;const y=e.pageY-sl.offsetTop;sl.scrollLeft=scrollLeft-(x-startX)*1.5;sl.scrollTop=scrollTop-(y-startY)*1.05})}function initEvents(){$$('[data-st-mode]').forEach(b=>b.addEventListener('click',()=>switchMatrixMode(b.getAttribute('data-st-mode'))));$$('[data-days]').forEach(b=>b.addEventListener('click',()=>setDaysCount(b.getAttribute('data-days'))));$("st-matrix-body").addEventListener("click",e=>{const th=e.target.closest(".st-corner-btn");if(!th)return;App.flash($("st-slider-viewport"));setTimeout(()=>triggerRowAnalysis(th.getAttribute("data-num"),Number(th.getAttribute("data-row-idx"))),100)});initDragToScroll()}function init(){initMatrixHead();switchMatrixMode("single");initEvents()}return{init,setDaysCount,switchMode:switchMatrixMode,getState:()=>({mode:state.currentMode,daysCount:state.daysCount})}})();
document.addEventListener("DOMContentLoaded",()=>{initSpaceBackButton();MatrixEngine.init();window.MatrixDaysSpace={setDays:MatrixEngine.setDaysCount,switchMode:MatrixEngine.switchMode,getState:MatrixEngine.getState}});
</script>
