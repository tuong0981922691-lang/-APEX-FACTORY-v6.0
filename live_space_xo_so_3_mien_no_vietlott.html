const LiveModule=(()=>{const SCHEDULE={MB:{0:"Thái Bình",1:"Hà Nội",2:"Quảng Ninh",3:"Bắc Ninh",4:"Hà Nội",5:"Hải Phòng",6:"Nam Định"},MN:{0:["Tiền Giang","Kiên Giang","Đà Lạt"],1:["TP. HCM","Đồng Tháp","Cà Mau"],2:["Bến Tre","Vũng Tàu","Bạc Liêu"],3:["Đồng Nai","Cần Thơ","Sóc Trăng"],4:["Tây Ninh","An Giang","Bình Thuận"],5:["Vĩnh Long","Bình Dương","Trà Vinh"],6:["TP. HCM","Long An","Bình Phước","Hậu Giang"]},MT:{0:["Khánh Hòa","Kon Tum"],1:["Thừa Thiên Huế","Phú Yên"],2:["Đắk Lắk","Quảng Nam"],3:["Đà Nẵng","Khánh Hòa"],4:["Bình Định","Quảng Trị","Quảng Bình"],5:["Gia Lai","Ninh Thuận"],6:["Đà Nẵng","Quảng Ngãi","Đắk Nông"]}};const TIMERS={mn:{target:"16:15:00",label:"Miền Nam"},mt:{target:"17:15:00",label:"Miền Trung"},mb:{target:"18:15:00",label:"Miền Bắc"}};const state={inited:false,activeStreams:{},sessionSeenNumbers:{},isMockSpinning:false,externalMode:false};const CHAT_USERS=["[KHÁN GIẢ]","[PHÒNG LIVE]","[HỆ THỐNG]","[THÀNH VIÊN]"];const CHAT_MSGS=["Bảng đang đồng bộ dữ liệu.","Đang chờ đến lượt quay.","Kết quả sẽ hiển thị theo từng giải.","Các đài hôm nay đã sẵn sàng.","Theo dõi bảng, không tự suy đoán ngoài dữ liệu."];
function getDots(n){return `<div class="live-dots">${'<span class="live-dot"></span>'.repeat(n)}</div>`}function box(n){return `<div class="live-number-box"><span class="live-number-text" data-len="${n}">${getDots(n)}</span></div>`}function buildBoardMB(sn){return `<div class="live-board" id="board-mb-${slug(sn)}" data-station="${sn}"><div class="live-board-head" style="color:var(--red)">ĐÀI ${esc(sn).toUpperCase()} · XSMB</div><div class="live-row live-row-db" data-prize="ĐB"><div class="live-prize db">ĐB</div><div class="live-results live-grid-1">${box(5)}</div></div><div class="live-row" data-prize="G1"><div class="live-prize">G1</div><div class="live-results live-grid-1">${box(5)}</div></div><div class="live-row" data-prize="G2"><div class="live-prize">G2</div><div class="live-results live-grid-2">${box(5).repeat(2)}</div></div><div class="live-row" data-prize="G3"><div class="live-prize">G3</div><div class="live-results live-grid-6">${box(5).repeat(6)}</div></div><div class="live-row" data-prize="G4"><div class="live-prize">G4</div><div class="live-results live-grid-4">${box(4).repeat(4)}</div></div><div class="live-row" data-prize="G5"><div class="live-prize">G5</div><div class="live-results live-grid-6">${box(4).repeat(6)}</div></div><div class="live-row" data-prize="G6"><div class="live-prize">G6</div><div class="live-results live-grid-3">${box(3).repeat(3)}</div></div><div class="live-row" data-prize="G7"><div class="live-prize">G7</div><div class="live-results live-grid-4">${box(2).repeat(4)}</div></div><div class="live-overlay-cd">--:--:--</div></div>`}function buildBoardProvince(sn,color){return `<div class="live-board" id="board-${slug(sn)}" data-station="${esc(sn)}"><div class="live-board-head" style="color:${color}">ĐÀI ${esc(sn).toUpperCase()}</div><div class="live-row live-row-db" data-prize="ĐB"><div class="live-prize db">ĐB</div><div class="live-results live-grid-1">${box(6)}</div></div><div class="live-row" data-prize="G1"><div class="live-prize">G1</div><div class="live-results live-grid-1">${box(5)}</div></div><div class="live-row" data-prize="G2"><div class="live-prize">G2</div><div class="live-results live-grid-1">${box(5)}</div></div><div class="live-row" data-prize="G3"><div class="live-prize">G3</div><div class="live-results live-grid-2">${box(5).repeat(2)}</div></div><div class="live-row" data-prize="G4"><div class="live-prize">G4</div><div class="live-results live-grid-7">${box(5).repeat(7)}</div></div><div class="live-row" data-prize="G5"><div class="live-prize">G5</div><div class="live-results live-grid-1">${box(4)}</div></div><div class="live-row" data-prize="G6"><div class="live-prize">G6</div><div class="live-results live-grid-3">${box(4).repeat(3)}</div></div><div class="live-row" data-prize="G7"><div class="live-prize">G7</div><div class="live-results live-grid-1">${box(3)}</div></div><div class="live-row" data-prize="G8"><div class="live-prize">G8</div><div class="live-results live-grid-1">${box(2)}</div></div><div class="live-overlay-cd">--:--:--</div></div>`}function buildLobby(){const dow=new Date().getDay();$("live-lobby").innerHTML=`<div class="live-lobby">${["mb","mn","mt"].map(r=>{const nm={mb:"MIỀN BẮC",mn:"MIỀN NAM",mt:"MIỀN TRUNG"};const stations=Array.isArray(getStations(r,dow))?getStations(r,dow):[getStations(r,dow)];return `<div class="live-card js-ripple" data-live-enter="${r}" data-region="${r}"><div class="live-card-head"><div class="live-region-name">${nm[r]}</div><div class="live-status" id="live-badge-${r}">CHỜ QUAY</div></div><div class="live-countdown" id="live-countdown-${r}">--:--:--<span>ĐANG TÍNH TOÁN</span></div><div class="live-stations" id="live-stations-${r}">Đài hôm nay: ${stations.map(esc).join(" · ")} <span class="station-count">${stations.length} đài</span></div><button class="live-enter-btn">VÀO PHÒNG ${nm[r]} ▶</button></div>`}).join("")}</div>`}function getStations(r,dow){if(r==="mb")return SCHEDULE.MB[dow];if(r==="mn")return SCHEDULE.MN[dow];return SCHEDULE.MT[dow]}function buildRoomShell(r){const tm={mb:["🔴 TRỰC TIẾP XỔ SỐ MIỀN BẮC","var(--red)"],mn:["🔴 TRỰC TIẾP XỔ SỐ MIỀN NAM","var(--blue-2)"],mt:["🔴 TRỰC TIẾP XỔ SỐ MIỀN TRUNG","var(--purple)"]};const ch={mb:"MIỀN BẮC",mn:"MIỀN NAM",mt:"MIỀN TRUNG"};$(`live-room-${r}`).innerHTML=`<div class="live-room-head"><button class="live-back-btn js-ripple" data-live-back="1">🔙</button><div class="live-room-title" style="color:${tm[r][1]}"><span class="live-shine">${tm[r][0]}</span></div><button class="live-draw-btn js-ripple" id="live-draw-btn-${r}">QUAY THỬ</button></div><div class="live-meta-strip" id="live-strip-${r}"></div><div class="live-info-panel" id="live-info-${r}"></div><div class="live-room-feed" id="live-feed-${r}"></div><div class="live-chat-box"><div class="live-chat-head">KÊNH THEO DÕI TRỰC TIẾP - ${ch[r]}</div><div class="live-chat-stream" id="live-chat-stream-${r}"></div><button class="live-heart-btn js-ripple" data-live-heart="${r}">❤️<div class="live-heart-float" id="live-heart-float-${r}"></div></button></div>`}function buildRooms(){buildRoomShell("mb");buildRoomShell("mn");buildRoomShell("mt");const dow=new Date().getDay();const mbStation=SCHEDULE.MB[dow];setStrip("mb",[mbStation]);$("live-info-mb").innerHTML=`<strong>Miền Bắc</strong>: một đài đại diện mỗi ngày, bảng chuẩn ĐB 5 số, G1-G7 theo cấu trúc XSMB.`;$("live-feed-mb").innerHTML=buildBoardMB(mbStation);const mn=SCHEDULE.MN[dow];setStrip("mn",mn);$("live-info-mn").innerHTML=`<strong>Miền Nam</strong>: hôm nay có ${mn.length} đài phát. Mỗi đài dùng bảng chuẩn ĐB 6 số, có G8 2 số.`;$("live-feed-mn").innerHTML=mn.map(s=>buildBoardProvince(s,"#0ea5e9")).join("");const mt=SCHEDULE.MT[dow];setStrip("mt",mt);$("live-info-mt").innerHTML=`<strong>Miền Trung</strong>: hôm nay có ${mt.length} đài phát. Mỗi đài dùng bảng chuẩn ĐB 6 số, có G8 2 số.`;$("live-feed-mt").innerHTML=mt.map(s=>buildBoardProvince(s,"#8b5cf6")).join("")}function setStrip(r,stations){$(`live-strip-${r}`).innerHTML=stations.map((s,i)=>`<button class="station-chip js-ripple ${i===0?'active':''}" data-jump-station="${slug(s)}">${esc(s)}</button>`).join("")}function showSub(id){$$('.live-sub').forEach(el=>el.classList.remove('active'));$(id).classList.add('active')}function enterRoom(r){showSub(`live-room-${r}`);startFakeChatStream(r);App.toast(`Đã mở phòng ${r.toUpperCase()}.`,"success")}function exitRoom(){showSub("live-lobby")}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function randomDigits(len){return Array(len).fill(0).map(()=>Math.floor(Math.random()*10)).join("")}async function triggerDraw(r){const btn=$(`live-draw-btn-${r}`);if(!btn||btn.disabled){App.toast("Bảng đang khóa hoặc đang quay.","warn");return}btn.disabled=true;state.isMockSpinning=true;state.sessionSeenNumbers[r]={};const orig=btn.textContent;btn.textContent="🔴 ĐANG QUAY...";const c=$(`live-feed-${r}`);$$('.live-number-text',c).forEach(el=>{el.innerHTML=getDots(Number(el.getAttribute('data-len')||'2'))});const order=r==="mb"?["G1","G2","G3","G4","G5","G6","G7","ĐB"]:["G8","G7","G6","G5","G4","G3","G2","G1","ĐB"];for(const prize of order){const rows=$$(`.live-row[data-prize="${prize}"]`,c);rows.forEach(row=>row.querySelector('.live-prize')?.classList.add('active-led'));const all=[];rows.forEach(row=>row.querySelectorAll('.live-number-text').forEach(el=>all.push(el)));all.forEach(el=>el.classList.add('spinning'));const si=setInterval(()=>all.forEach(el=>{el.textContent=randomDigits(Number(el.getAttribute('data-len')||'2'))}),50);await sleep(450);clearInterval(si);all.forEach(el=>{el.classList.remove('spinning');const fn=randomDigits(Number(el.getAttribute('data-len')||'2'));el.textContent=fn;analyzeRealtime(r,fn)});rows.forEach(row=>row.querySelector('.live-prize')?.classList.remove('active-led'));await sleep(260)}btn.textContent=orig;btn.disabled=false;state.isMockSpinning=false;App.toast(`Đã mô phỏng xong phòng ${r.toUpperCase()}.`,"success")}function analyzeRealtime(r,ns){if(!ns||ns.length<2)return;const l2=ns.slice(-2);if(!state.sessionSeenNumbers[r])state.sessionSeenNumbers[r]={};state.sessionSeenNumbers[r][l2]=(state.sessionSeenNumbers[r][l2]||0)+1;if(state.sessionSeenNumbers[r][l2]>1)appendMessage(r,"[HỆ THỐNG]",`Đuôi ${l2} xuất hiện ${state.sessionSeenNumbers[r][l2]} lần trong phiên mô phỏng.`)}function updateClockAndCountdown(){const clock=$("live-global-clock");const now=new Date();const ds=["CHỦ NHẬT","THỨ 2","THỨ 3","THỨ 4","THỨ 5","THỨ 6","THỨ 7"];clock.textContent=`${ds[now.getDay()]}, ${now.toLocaleDateString("vi-VN")} | ${now.toLocaleTimeString("vi-VN",{hour12:false})}`;Object.keys(TIMERS).forEach(r=>{const ce=$(`live-countdown-${r}`),badge=$(`live-badge-${r}`),btn=$(`live-draw-btn-${r}`);if(!ce||!badge)return;ce.className='live-countdown';ce.style.cssText='';badge.className='live-status';badge.style.cssText='';const [h,m,s]=TIMERS[r].target.split(':').map(Number);const target=new Date();target.setHours(h,m,s||0,0);const diff=target-now;if(diff>0){const hh=pad2(Math.floor((diff/3600000)%24)),mm=pad2(Math.floor((diff/60000)%60)),ss=pad2(Math.floor((diff/1000)%60));ce.innerHTML=`${hh}:${mm}:${ss}<span>ĐẾN GIỜ QUAY ${TIMERS[r].target.slice(0,5)}</span>`;if(diff<=5*60*1000){ce.classList.add('danger');badge.textContent='SẮP QUAY';badge.classList.add('now');if(btn&&!state.isMockSpinning){btn.disabled=true;btn.textContent='🔒 KHÓA BẢNG'}}else if(diff<=60*60*1000){ce.classList.add('warning');badge.textContent='SẮP ĐẾN GIỜ';if(btn&&!state.isMockSpinning){btn.disabled=false;btn.textContent='QUAY THỬ'}}else{badge.textContent='CHỜ QUAY';if(btn&&!state.isMockSpinning){btn.disabled=false;btn.textContent='QUAY THỬ'}}}else if(diff>-35*60*1000){ce.classList.add('danger');ce.innerHTML=`00:00:00<span>ĐANG TRONG KHUNG QUAY</span>`;badge.textContent='ĐANG QUAY';badge.classList.add('now');if(btn&&!state.isMockSpinning){btn.disabled=true;btn.textContent='🔴 ĐANG QUAY THẬT'}}else{ce.innerHTML=`ĐÃ KẾT THÚC<span>HẸN NGÀY MAI</span>`;ce.style.color='#10b981';ce.style.borderColor='#10b981';badge.textContent='ĐÃ QUAY XONG';badge.style.background='#10b981';badge.style.color='#fff';if(btn&&!state.isMockSpinning){btn.disabled=false;btn.textContent='QUAY THỬ LẠI'}}const rf=$(`live-feed-${r}`);if(!rf||state.isMockSpinning)return;const ols=$$('.live-overlay-cd',rf);if(diff<=5*60*1000||diff<0)ols.forEach(el=>el.style.opacity='0');else{const d=Math.max(diff,0);const hh2=pad2(Math.floor((d/3600000)%24)),mm2=pad2(Math.floor((d/60000)%60)),ss2=pad2(Math.floor((d/1000)%60));ols.forEach(el=>{el.style.opacity='1';el.textContent=`${hh2}:${mm2}:${ss2}`})}})}function appendMessage(r,u,t){const s=$(`live-chat-stream-${r}`);if(!s)return;const d=document.createElement('div');d.className='live-chat-msg';d.innerHTML=`<span class="u">${esc(u)}</span><span class="t">${esc(t)}</span>`;s.appendChild(d);s.scrollTop=s.scrollHeight}function startFakeChatStream(r){clearInterval(state.activeStreams[r]);const s=$(`live-chat-stream-${r}`);if(!s)return;s.innerHTML='';appendMessage(r,'[HỆ THỐNG]',`Chào mừng phòng ${r.toUpperCase()}. Chỉ hiển thị kết quả và trạng thái bảng.`);state.activeStreams[r]=setInterval(()=>{if(Math.random()>.72){appendMessage(r,CHAT_USERS[Math.floor(Math.random()*CHAT_USERS.length)],CHAT_MSGS[Math.floor(Math.random()*CHAT_MSGS.length)]);if(Math.random()>.86)dropHeart(r)}},1600)}function dropHeart(r){const w=$(`live-heart-float-${r}`);if(!w)return;const h=document.createElement('div');h.className='live-floating-heart';h.textContent='❤️';h.style.left=`${Math.random()*20-10}px`;w.appendChild(h);setTimeout(()=>h.remove(),1500)}function bindEvents(){$('live-lobby').addEventListener('click',e=>{const c=e.target.closest('[data-live-enter]');if(c)enterRoom(c.getAttribute('data-live-enter'))});['mb','mn','mt'].forEach(r=>{$(`live-room-${r}`).addEventListener('click',e=>{if(e.target.closest('[data-live-back]'))exitRoom();const j=e.target.closest('[data-jump-station]');if(j){$$('.station-chip',$(`live-strip-${r}`)).forEach(x=>x.classList.remove('active'));j.classList.add('active');const board=document.getElementById('board-'+j.getAttribute('data-jump-station'));if(board)board.scrollIntoView({behavior:'smooth',block:'start'})}if(e.target.closest(`[data-live-heart="${r}"]`))dropHeart(r)});$(`live-draw-btn-${r}`).addEventListener('click',()=>triggerDraw(r))})}function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function slug(v){return String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function updateResult(region,station,prize,values){const r=String(region||'').toLowerCase();const st=slug(station||'');const board=document.getElementById(r==='mb'?`board-mb-${st}`:`board-${st}`);if(!board)return false;const row=board.querySelector(`.live-row[data-prize="${prize}"]`);if(!row)return false;const boxes=$$('.live-number-text',row);const arr=Array.isArray(values)?values:[values];boxes.forEach((el,i)=>{if(arr[i]!=null)el.textContent=String(arr[i])});return true}function setRegionStatus(region,htmlText){const info=$(`live-info-${String(region).toLowerCase()}`);if(info)info.innerHTML=htmlText}function init(){if(state.inited)return;state.inited=true;buildLobby();buildRooms();bindEvents();updateClockAndCountdown();setInterval(updateClockAndCountdown,1000);showSub('live-lobby');window.LiveResultSpace={openRoom:enterRoom,back:exitRoom,updateResult,setRegionStatus,rebuild(){buildLobby();buildRooms();updateClockAndCountdown()}}}return{init}})();document.addEventListener('DOMContentLoaded',()=>LiveModule.init());
</script>
