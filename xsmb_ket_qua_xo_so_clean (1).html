"use strict";
const USE_DEMO_DATA=true;const MAX_HISTORY_DAYS=120;const INITIAL_RENDER_DAYS=40;const LOAD_MORE_STEP=20;const REAL_LOTTERY_DATA=[];const PRIZES=[{name:"ĐB",len:5,count:1,grid:"grid-1",db:true},{name:"G1",len:5,count:1,grid:"grid-1",db:false},{name:"G2",len:5,count:2,grid:"grid-2",db:false},{name:"G3",len:5,count:6,grid:"grid-6",db:false},{name:"G4",len:4,count:4,grid:"grid-4",db:false},{name:"G5",len:4,count:6,grid:"grid-6",db:false},{name:"G6",len:3,count:3,grid:"grid-3",db:false},{name:"G7",len:2,count:4,grid:"grid-4",db:false}];const QUAY_ORDER=["G1","G2","G3","G4","G5","G6","G7","ĐB"];const CauGraph={nodes:[],edges:[],counter:0,lastNodeId:null};let isRunning=false;let renderedHistoryDays=0;let historyData=[];function generateRandom(length){let result="";for(let i=0;i<length;i++){result+=Math.floor(Math.random()*10)}return result}function wrapDigits(numStr){if(!numStr)return"";return String(numStr).split("").map(function(digit,index){return '<span class="digit" data-idx="'+index+'">'+digit+'</span>'}).join("")}function sleep(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}function createDots(length){let dots="";for(let i=0;i<length;i++){dots+='<span class="dot"></span>'}return '<div class="dots-wrapper">'+dots+'</div>'}function normalizePrizeList(list,expectedCount){const safeList=Array.isArray(list)?list.slice(0,expectedCount):[];while(safeList.length<expectedCount){safeList.push("")}return safeList}function createNumberBox(length,value,isMaskableDb){const content=value?wrapDigits(value):createDots(length);const maskClass=isMaskableDb?" maskable-db":"";const maskHtml=isMaskableDb?'<div class="mask-cover" onclick="revealDbNumber(this)"><span class="eye">🙈</span> Chạm để xem</div>':"";return '<div class="number-box'+maskClass+'">'+maskHtml+'<span class="number-text num-font">'+content+'</span></div>'}function createPrizeRowFromValues(prize,values,mode){const isDb=prize.db===true;const rowClass=isDb?"row row-db":"row";const labelClass=isDb?"prize-name db":"prize-name";const normalized=normalizePrizeList(values,prize.count);const boxes=normalized.map(function(value){return createNumberBox(prize.len,value,mode==="live"&&isDb)});return '<div class="'+rowClass+'" data-prize="'+prize.name+'" data-len="'+prize.len+'"><div class="'+labelClass+'">'+prize.name+'</div><div class="prize-results '+prize.grid+'">'+boxes.join("")+'</div></div>'}function createDemoPrizeValues(prize,mode){const arr=[];for(let i=0;i<prize.count;i++){arr.push(mode==="live"?"":generateRandom(prize.len))}return arr}function createPrizeRow(prize,mode,dayData){if(dayData&&dayData.prizes&&Array.isArray(dayData.prizes[prize.name])){return createPrizeRowFromValues(prize,dayData.prizes[prize.name],mode)}return createPrizeRowFromValues(prize,createDemoPrizeValues(prize,mode),mode)}document.addEventListener("DOMContentLoaded",function(){setLiveDate();buildHistoryData();renderLiveBoard();renderInitialHistoryBoards();bindCauClicks();bindLazyLoad();prepareSvgSize()});function setLiveDate(){const d=new Date(2026,2,26);let s=d.toLocaleDateString("vi-VN",{weekday:"long",year:"numeric",month:"2-digit",day:"2-digit"});document.getElementById("live-date").textContent=s.charAt(0).toUpperCase()+s.slice(1)}function buildHistoryData(){if(!USE_DEMO_DATA&&REAL_LOTTERY_DATA.length>0){historyData=REAL_LOTTERY_DATA.slice(0,MAX_HISTORY_DAYS);return}const baseDate=new Date(2026,2,25);const demo=[];for(let i=0;i<MAX_HISTORY_DAYS;i++){const d=new Date(baseDate);d.setDate(d.getDate()-i);let day=d.toLocaleDateString("vi-VN",{weekday:"long",year:"numeric",month:"2-digit",day:"2-digit"});day=day.charAt(0).toUpperCase()+day.slice(1);const prizes={};PRIZES.forEach(function(prize){prizes[prize.name]=[];for(let j=0;j<prize.count;j++){prizes[prize.name].push(generateRandom(prize.len))}});demo.push({date:d.toISOString().slice(0,10),displayDate:day,title:"Kết quả xổ số Thần Mèo",prizes:prizes})}historyData=demo}function renderLiveBoard(){document.getElementById("live-rows-container").innerHTML=PRIZES.map(function(prize){return createPrizeRow(prize,"live",null)}).join("")}function createHistoryBoard(dayData){const title=dayData.title||"Kết quả xổ số miền Bắc";const dateText=dayData.displayDate||dayData.date||"Chưa có ngày";return '<div class="board"><div class="board-header"><div class="board-title">'+escapeHtml(title)+'</div><div class="board-date">'+escapeHtml(dateText)+'</div></div>'+PRIZES.map(function(prize){return createPrizeRow(prize,"history",dayData)}).join("")+'</div>'}function renderInitialHistoryBoards(){renderedHistoryDays=0;document.getElementById("history-boards-container").innerHTML="";renderMoreHistoryBoards(INITIAL_RENDER_DAYS)}function renderMoreHistoryBoards(amount){const container=document.getElementById("history-boards-container");const start=renderedHistoryDays;const end=Math.min(renderedHistoryDays+amount,historyData.length);const html=[];for(let i=start;i<end;i++){html.push(createHistoryBoard(historyData[i]))}container.insertAdjacentHTML("beforeend",html.join(""));renderedHistoryDays=end;updateLoadInfo();prepareSvgSize();redrawCauArrows()}function updateLoadInfo(){const info=document.getElementById("load-info");if(!info)return;if(renderedHistoryDays>=historyData.length){info.textContent="Đã tải đủ "+renderedHistoryDays+" bảng."}else{info.textContent="Đã tải "+renderedHistoryDays+"/"+historyData.length+" bảng · Vuốt xuống để tải thêm."}}function bindLazyLoad(){const feed=document.getElementById("boards-feed-container");let locked=false;feed.addEventListener("scroll",function(){redrawCauArrows();if(locked)return;if(renderedHistoryDays>=historyData.length)return;const nearBottom=feed.scrollTop+feed.clientHeight>=feed.scrollHeight-700;if(!nearBottom)return;locked=true;renderMoreHistoryBoards(LOAD_MORE_STEP);locked=false})}function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function toggleCau(cb){document.getElementById("app-wrapper").classList.toggle("cau-on",cb.checked);redrawCauArrows()}function toggleMask(cb){const app=document.getElementById("app-wrapper");app.classList.toggle("masking",cb.checked);document.querySelectorAll(".maskable-db.revealed").forEach(function(box){box.classList.remove("revealed")});redrawCauArrows()}function revealDbNumber(maskElement){const box=maskElement.closest(".number-box");if(box){box.classList.add("revealed");redrawCauArrows()}}function bindCauClicks(){const feed=document.getElementById("boards-feed-container");feed.addEventListener("click",function(e){if(!document.getElementById("toggle-cau").checked)return;if(e.target.closest(".mask-cover"))return;const digit=e.target.closest(".digit");if(!digit)return;const box=digit.closest(".number-box");const app=document.getElementById("app-wrapper");if(box&&box.classList.contains("maskable-db")&&app.classList.contains("masking")&&!box.classList.contains("revealed")){return}addManualCauNode(digit)});window.addEventListener("resize",function(){prepareSvgSize();redrawCauArrows()})}function createCauNode(digitElement){const numberText=digitElement.closest(".number-text");const row=digitElement.closest(".row");const board=digitElement.closest(".board");if(!numberText||!row||!board)return null;const existingId=digitElement.dataset.cauNodeId;if(existingId){return CauGraph.nodes.find(function(node){return node.id===existingId})||null}const boardList=Array.from(document.querySelectorAll(".board"));const boardIndex=boardList.indexOf(board);const boardDateEl=board.querySelector(".board-date");const fullNumber=numberText.textContent.trim();const digitIndex=Number(digitElement.dataset.idx||0);const digit=digitElement.textContent.trim();const prize=row.dataset.prize||"";CauGraph.counter+=1;const node={id:"cau-node-"+CauGraph.counter,digit:digit,fullNumber:fullNumber,digitIndex:digitIndex,prize:prize,boardIndex:boardIndex,dateText:boardDateEl?boardDateEl.textContent.trim():"",element:digitElement};digitElement.dataset.cauNodeId=node.id;digitElement.classList.add("active-cau");digitElement.setAttribute("title","Điểm cầu "+CauGraph.counter);CauGraph.nodes.push(node);return node}function addManualCauNode(digitElement){const node=createCauNode(digitElement);if(!node)return;digitElement.classList.add("active-cau");if(CauGraph.lastNodeId&&CauGraph.lastNodeId!==node.id){const duplicated=CauGraph.edges.some(function(edge){return edge.fromId===CauGraph.lastNodeId&&edge.toId===node.id});if(!duplicated){CauGraph.edges.push({fromId:CauGraph.lastNodeId,toId:node.id})}}CauGraph.lastNodeId=node.id;prepareSvgSize();redrawCauArrows()}function prepareSvgSize(){const feed=document.getElementById("boards-feed-container");const svg=document.getElementById("cau-svg-layer");if(!feed||!svg)return;const height=Math.max(feed.scrollHeight,feed.clientHeight);svg.setAttribute("height",String(height));svg.style.height=height+"px"}function redrawCauArrows(){const svg=document.getElementById("cau-svg-layer");const feed=document.getElementById("boards-feed-container");if(!svg||!feed)return;prepareSvgSize();Array.from(svg.querySelectorAll(".cau-arrow-line")).forEach(function(line){line.remove()});const feedRect=feed.getBoundingClientRect();const scrollTop=feed.scrollTop;const scrollLeft=feed.scrollLeft;CauGraph.edges.forEach(function(edge){const fromNode=CauGraph.nodes.find(function(node){return node.id===edge.fromId});const toNode=CauGraph.nodes.find(function(node){return node.id===edge.toId});if(!fromNode||!toNode||!fromNode.element||!toNode.element)return;if(!document.body.contains(fromNode.element)||!document.body.contains(toNode.element))return;const fromRect=fromNode.element.getBoundingClientRect();const toRect=toNode.element.getBoundingClientRect();const x1=fromRect.left-feedRect.left+fromRect.width/2+scrollLeft;const y1=fromRect.top-feedRect.top+fromRect.height/2+scrollTop;const x2=toRect.left-feedRect.left+toRect.width/2+scrollLeft;const y2=toRect.top-feedRect.top+toRect.height/2+scrollTop;const dx=Math.abs(x2-x1);const dy=Math.abs(y2-y1);const curve=Math.max(35,Math.min(140,(dx+dy)/3));const direction=x2>=x1?1:-1;const c1x=x1+curve*direction;const c1y=y1;const c2x=x2-curve*direction;const c2y=y2;const path=document.createElementNS("http://www.w3.org/2000/svg","path");path.setAttribute("d","M "+x1+" "+y1+" C "+c1x+" "+c1y+", "+c2x+" "+c2y+", "+x2+" "+y2);path.setAttribute("class","cau-arrow-line");path.setAttribute("marker-end","url(#arrow-head-manual)");svg.appendChild(path)})}function clearAllCau(){CauGraph.nodes=[];CauGraph.edges=[];CauGraph.counter=0;CauGraph.lastNodeId=null;document.querySelectorAll(".digit").forEach(function(digit){digit.classList.remove("active-cau","digit-focus");digit.removeAttribute("data-cau-node-id");digit.removeAttribute("title")});document.querySelectorAll(".number-box.focus-match,.number-box.focus-soft").forEach(function(box){box.classList.remove("focus-match","focus-soft")});document.querySelectorAll(".board.board-hit").forEach(function(b){b.classList.remove("board-hit")});redrawCauArrows()}function clearLiveCauNodes(){const liveBoard=document.getElementById("board-live");if(!liveBoard)return;const liveNodeIds=CauGraph.nodes.filter(function(node){return node.element&&liveBoard.contains(node.element)}).map(function(node){return node.id});CauGraph.nodes=CauGraph.nodes.filter(function(node){return liveNodeIds.indexOf(node.id)===-1});CauGraph.edges=CauGraph.edges.filter(function(edge){return liveNodeIds.indexOf(edge.fromId)===-1&&liveNodeIds.indexOf(edge.toId)===-1});liveBoard.querySelectorAll(".digit").forEach(function(digit){digit.classList.remove("active-cau","digit-focus");digit.removeAttribute("data-cau-node-id");digit.removeAttribute("title")});if(liveNodeIds.indexOf(CauGraph.lastNodeId)!==-1){CauGraph.lastNodeId=null}redrawCauArrows()}async function triggerQuayThu(cb){if(!cb.checked||isRunning)return;isRunning=true;cb.disabled=true;await startSimulation();cb.checked=false;cb.disabled=false;isRunning=false}async function startSimulation(){clearLiveCauNodes();const status=document.getElementById("live-status");const dropZone=document.getElementById("loto-drop-zone");const slotTitle=document.getElementById("slot-title");const app=document.getElementById("app-wrapper");status.textContent="🔴 Đang quay số...";status.style.color="var(--db-bg)";dropZone.innerHTML="";slotTitle.textContent="⚡ Hệ thống đang lấy kết quả...";document.querySelectorAll(".maskable-db.revealed").forEach(function(box){box.classList.remove("revealed")});document.querySelectorAll("#board-live .number-text").forEach(function(textBox){const row=textBox.closest(".row");const len=Number(row.dataset.len);textBox.classList.remove("spinning");textBox.innerHTML=createDots(len)});const rows=Array.from(document.querySelectorAll("#board-live .row"));const msgs=["đã rơi vào bảng hiển thị", "được ghi nhận để phân tích rủi ro", "đã xuất hiện trong kỳ mô phỏng", "đã vào vùng quan sát", "đã được đưa vào lô rơi"];for(const name of QUAY_ORDER){const row=rows.find(function(item){return item.dataset.prize===name});if(!row)continue;const len=Number(row.dataset.len);const label=row.querySelector(".prize-name");const boxes=row.querySelectorAll(".number-text");label.classList.add("active-led");for(const box of boxes){box.classList.add("spinning");const spin=setInterval(function(){box.textContent=generateRandom(len)},50);await sleep(900);clearInterval(spin);box.classList.remove("spinning");const finalNumber=generateRandom(len);box.innerHTML=wrapDigits(finalNumber);const lo=finalNumber.slice(-2);const chip=document.createElement("div");chip.className="lo-chip";chip.textContent=lo;dropZone.appendChild(chip);const message=msgs[Math.floor(Math.random()*msgs.length)];slotTitle.textContent="🔥 Lô "+lo+" "+message+" ("+name+")";slotTitle.classList.add("flash");setTimeout(function(){slotTitle.classList.remove("flash")},500);await sleep(150)}label.classList.remove("active-led")}if(app.classList.contains("masking")){document.querySelectorAll(".maskable-db.revealed").forEach(function(box){box.classList.remove("revealed")})}status.textContent="✅ Đã quay xong";status.style.color="var(--led-color)";slotTitle.textContent="Kỳ quay kết thúc · Bật 'Làm Cầu' để chấm cầu các giải.";prepareSvgSize();redrawCauArrows();}
