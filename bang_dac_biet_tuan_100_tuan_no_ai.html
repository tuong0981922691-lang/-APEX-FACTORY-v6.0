<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BẢNG ĐẶC BIỆT TUẦN</title>
<style>
:root{--bg-deep:#070403;--bg-main:#130d09;--text-main:#f8f1e7;--text-muted:#b89f85;--yellow:#facc15;--green:#10b981;--red:#ef4444;--blue:#38bdf8;--border-warm:rgba(250,204,21,.34);--shadow:0 12px 32px rgba(0,0,0,.58);--font-ui:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-webkit-tap-highlight-color:transparent;font-family:var(--font-ui)}*::-webkit-scrollbar{display:none}html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text-main)}body{display:flex;justify-content:center;align-items:flex-start;background:radial-gradient(circle at 50% -18%,rgba(90,56,34,.50),transparent 42%),linear-gradient(180deg,#070403,#130d09 45%,#070403)}.app-wrapper{max-width:480px;width:100%;height:100%;position:relative;background:radial-gradient(circle at 50% -18%,rgba(90,56,34,.42),transparent 42%),linear-gradient(180deg,var(--bg-main),var(--bg-deep));overflow:hidden;box-shadow:0 0 50px rgba(0,0,0,1);display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.04)}.app-wrapper::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 7%,rgba(250,204,21,.08),transparent 26%),radial-gradient(circle at 88% 12%,rgba(217,119,6,.08),transparent 30%),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(180deg,rgba(255,255,255,.010) 1px,transparent 1px);background-size:auto,auto,34px 34px,34px 34px;opacity:.78;z-index:0}.sub-screen{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;min-height:0;background:transparent;border-bottom:5px solid var(--green)}.db-workspace{display:flex;flex:1;min-height:0;overflow:hidden;position:relative;padding-top:env(safe-area-inset-top)}.layer-matrix{width:100%;height:100%;background:transparent;display:flex;flex-direction:column;min-height:0;z-index:20}.glass-header-4duy{padding:10px calc(env(safe-area-inset-right) + 10px) 10px calc(env(safe-area-inset-left) + 10px);background:linear-gradient(180deg,rgba(58,36,22,.97),rgba(19,13,9,.96)),radial-gradient(circle at 10% 0%,rgba(250,204,21,.14),transparent 38%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border-warm);display:flex;flex-direction:column;gap:9px;z-index:25;box-shadow:0 8px 18px rgba(0,0,0,.50);flex-shrink:0}.header-main-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.board-title-label{min-width:0;font-size:13px;font-weight:1000;color:#fef3c7;text-transform:uppercase;letter-spacing:.9px;text-shadow:0 0 8px rgba(250,204,21,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}.mini-action-btn{height:30px;border-radius:999px;border:1px solid rgba(250,204,21,.35);background:rgba(0,0,0,.22);color:#fef3c7;padding:0 10px;font-size:10px;font-weight:1000;letter-spacing:.6px;cursor:pointer;text-transform:uppercase;box-shadow:inset 0 0 10px rgba(250,204,21,.06);transition:.22s;white-space:nowrap}.mini-action-btn:active{transform:scale(.94)}.mini-action-btn.bridge{border-color:rgba(56,189,248,.34);color:#bae6fd}.mini-action-btn.auto{border-color:rgba(16,185,129,.46);color:#bbf7d0;background:rgba(16,185,129,.10);box-shadow:0 0 12px rgba(16,185,129,.18)}.mini-action-btn.auto.running{color:#111827;background:var(--green);border-color:var(--green);box-shadow:0 0 18px rgba(16,185,129,.55)}.control-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.status-mini{min-width:0;font-size:10px;color:#b89f85;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.counter-pill{font-size:10px;color:#111827;background:#facc15;border:1px solid rgba(255,255,255,.18);font-weight:1000;border-radius:999px;padding:5px 8px;white-space:nowrap;box-shadow:0 0 12px rgba(250,204,21,.25)}.view-panel{display:flex;width:100%;flex:1;min-height:0;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,rgba(42,25,15,.72),rgba(19,13,9,.96));position:relative}.grid-scroll{overflow-y:auto;flex:1;height:100%;position:relative;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}.grid-stage{position:relative;min-height:100%}.grid-header{display:grid;grid-template-columns:repeat(7,1fr);background:#090503;border-bottom:2px solid rgba(250,204,21,.22);position:sticky;top:0;z-index:8}.grid-row{display:grid;grid-template-columns:repeat(7,1fr)}.grid-cell{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 0;border-right:1px solid rgba(248,241,231,.07);border-bottom:1px solid rgba(248,241,231,.07);background:rgba(22,13,8,.92);cursor:pointer;transition:background .22s,box-shadow .22s,transform .22s,border-color .22s;position:relative;overflow:hidden;user-select:none;touch-action:manipulation}.grid-cell:hover{background:rgba(42,25,15,.96)}.grid-header .grid-cell{min-height:38px;padding:10px 0;font-size:11px;font-weight:1000;color:#d6c2ad;background:#090503;border-right:1px solid rgba(250,204,21,.08);border-bottom:none;cursor:default}.week-label{position:absolute;left:4px;top:4px;font-size:8px;color:rgba(214,194,173,.44);font-weight:900;z-index:2}.grid-cell.cell-lit{background:radial-gradient(circle at 50% 46%,rgba(255,242,178,.33),rgba(250,204,21,.18) 42%,rgba(47,29,12,.98) 76%);box-shadow:inset 0 0 18px rgba(250,204,21,.38),inset 0 0 36px rgba(245,158,11,.14),0 0 14px rgba(250,204,21,.32);border-color:rgba(250,204,21,.50);z-index:4;transform:translateY(-1px)}.grid-cell.cell-lit::before{content:"";position:absolute;inset:5px;border-radius:11px;border:1px solid rgba(255,239,171,.66);box-shadow:0 0 18px rgba(250,204,21,.42),inset 0 0 14px rgba(255,255,255,.08);animation:cellLightBreath 1.15s ease-in-out infinite alternate;pointer-events:none;z-index:1}.grid-cell.cell-lit::after{content:"";position:absolute;width:8px;height:8px;right:6px;top:6px;border-radius:50%;background:#fff7ad;box-shadow:0 0 8px #facc15,0 0 18px rgba(250,204,21,.8);animation:lampBlink .9s ease-in-out infinite alternate;z-index:3;pointer-events:none}.grid-cell.path-hit{background:radial-gradient(circle at 50% 45%,rgba(56,189,248,.20),rgba(250,204,21,.20) 47%,rgba(42,25,15,.98) 72%);box-shadow:inset 0 0 18px rgba(250,204,21,.24),0 0 12px rgba(56,189,248,.18);z-index:3}.grid-cell.path-hit::before{content:"";position:absolute;inset:5px;border-radius:10px;border:1px solid rgba(56,189,248,.52);animation:cellHalo 1.25s infinite alternate;pointer-events:none}@keyframes cellLightBreath{from{opacity:.58;transform:scale(.97)}to{opacity:1;transform:scale(1.03)}}@keyframes lampBlink{from{opacity:.55;transform:scale(.82)}to{opacity:1;transform:scale(1.14)}}@keyframes cellHalo{from{opacity:.35;transform:scale(.96)}to{opacity:1;transform:scale(1.03)}}.db-num-v5{font-size:15px;font-weight:1000;color:#f8fafc;letter-spacing:1px;display:flex;align-items:center;justify-content:center;width:100%;position:relative;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.62)}.cell-lit .db-num-v5{color:#fff;text-shadow:0 0 4px rgba(0,0,0,.80),0 0 10px rgba(250,204,21,.48)}.db-num-v5 .head-part{opacity:.58;font-size:12px;margin-right:2px;color:#ead8c2}.cell-lit .db-num-v5 .head-part{opacity:.86;color:#fff8dc}.db-num-v5 .red-tail{color:var(--red);text-shadow:0 0 8px rgba(239,68,68,.38)}.cell-lit .db-num-v5 .red-tail{color:#ff4d4d;text-shadow:0 0 4px rgba(0,0,0,.85),0 0 11px rgba(239,68,68,.75)}.db-date{font-size:10px;color:#9a7d61;font-weight:800;margin-top:3px;position:relative;z-index:2}.cell-lit .db-date{color:#ffe6a3;text-shadow:0 0 5px rgba(0,0,0,.75)}.bridge-overlay{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}.bridge-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.bridge-line-shadow{fill:none;stroke:rgba(0,0,0,.72);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.70}.bridge-line-main{fill:none;stroke:url(#bridgeGradient);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(250,204,21,.55));stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawBridge 1.05s cubic-bezier(.25,.9,.25,1) forwards}.bridge-line-pulse{fill:none;stroke:rgba(255,255,255,.82);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 18;animation:pulseTravel 1.4s linear infinite;opacity:.85}@keyframes drawBridge{to{stroke-dashoffset:0}}@keyframes pulseTravel{from{stroke-dashoffset:0}to{stroke-dashoffset:-60}}.bridge-node{position:absolute;width:18px;height:18px;margin-left:-9px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--yellow) 35%,#b45309 72%);border:1px solid rgba(255,255,255,.62);box-shadow:0 0 12px rgba(250,204,21,.92),0 0 28px rgba(245,158,11,.45);animation:nodeBurst .72s cubic-bezier(.175,.885,.32,1.275) forwards,nodeBreath 1.1s .72s infinite alternate;z-index:7}@keyframes nodeBurst{from{transform:scale(.15) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}@keyframes nodeBreath{from{transform:scale(.92)}to{transform:scale(1.18)}}.bridge-label{position:absolute;z-index:9;transform:translate(-50%,-100%);padding:5px 8px;border-radius:999px;background:rgba(0,0,0,.72);border:1px solid rgba(250,204,21,.40);color:#fef3c7;font-size:10px;font-weight:1000;white-space:nowrap;box-shadow:0 0 14px rgba(0,0,0,.46);pointer-events:none}.toast-stack{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}.toast{padding:11px 13px;border-radius:14px;color:#fff;font-size:13px;line-height:1.45;border:1px solid rgba(255,255,255,.10);background:rgba(28,18,12,.94);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:toastIn .28s ease}.toast.success{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.45)}.toast.warn{background:rgba(250,204,21,.14);border-color:rgba(250,204,21,.45)}@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:390px){.board-title-label{font-size:12px}.mini-action-btn{padding:0 8px;font-size:9px}.grid-cell{min-height:54px}.db-num-v5{font-size:14px}.counter-pill{font-size:9px;padding:5px 7px}}
</style>
</head>
<body>
<div class="app-wrapper"><div class="toast-stack" id="toast-stack"></div><div id="stats-screen-db" class="sub-screen"><div class="db-workspace"><div class="layer-matrix" id="matrix-layer"><div class="glass-header-4duy"><div class="header-main-row"><div class="board-title-label">📊 ĐẶC BIỆT TUẦN</div><div class="header-actions"><button id="btn-auto-bridge" class="mini-action-btn auto" type="button">LÀM CẦU</button><button id="btn-clear-light" class="mini-action-btn" type="button">TẮT SÁNG</button><button id="btn-send-bridge" class="mini-action-btn bridge" type="button">CHUYỂN</button></div></div><div class="control-row"><div class="status-mini" id="bridge-status">Chạm một ô để bật sáng, chạm lại lần hai để tắt.</div><div class="counter-pill" id="week-counter">100 TUẦN · 0 Ô SÁNG</div></div></div><div id="view-weekly" class="view-panel"><div class="grid-scroll" id="grid-scroll"><div class="grid-stage" id="grid-stage"><div id="weekly-grid-content"></div><div class="bridge-overlay" id="bridge-overlay"><svg class="bridge-svg" id="bridge-svg"><defs><linearGradient id="bridgeGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ef4444"></stop><stop offset="42%" stop-color="#facc15"></stop><stop offset="72%" stop-color="#10b981"></stop><stop offset="100%" stop-color="#38bdf8"></stop></linearGradient></defs><path id="bridge-shadow" class="bridge-line-shadow" d=""></path><path id="bridge-main" class="bridge-line-main" d=""></path><path id="bridge-pulse" class="bridge-line-pulse" d=""></path></svg><div id="bridge-nodes"></div><div id="bridge-label" class="bridge-label" style="display:none;">CẦU TÌM THẤY</div></div></div></div></div></div></div></div></div>
<script>
"use strict";const $=id=>document.getElementById(id);const $$=(sel,root=document)=>Array.from(root.querySelectorAll(sel));const TOTAL_WEEKS=100;let currentBridgeRunId=0;let latestBridgePath=[];const App={toast(message,type="success",duration=1800){const stack=$("toast-stack");if(!stack)return;const div=document.createElement("div");div.className="toast "+type;div.textContent=message;stack.appendChild(div);setTimeout(()=>{div.style.opacity="0";div.style.transform="translateY(-8px)";setTimeout(()=>div.remove(),220)},duration)}};function seededNumber(seed,max){let x=Math.sin(seed*999.91)*10000;return Math.floor((x-Math.floor(x))*max)}function renderWeeklyGrid(){const weekContainer=$("weekly-grid-content");let html='<div class="grid-header">';["T.2","T.3","T.4","T.5","T.6","T.7","CN"].forEach(day=>{html+='<div class="grid-cell">'+day+'</div>'});html+='</div>';for(let week=0;week<TOTAL_WEEKS;week++){html+='<div class="grid-row">';for(let day=0;day<7;day++){const seed=(week+1)*37+(day+1)*19;const n1=String(seededNumber(seed,1000)).padStart(3,"0");const n2=String(seededNumber(seed+7,100)).padStart(2,"0");const date=String((week*7+day)%28+1).padStart(2,"0")+"/"+String(((week*7+day)%12)+1).padStart(2,"0");html+=`<div class="grid-cell" data-week="${week}" data-day="${day}" data-tail="${n2}" role="button" aria-pressed="false" tabindex="0"><span class="week-label">W${week+1}</span><div class="db-num-v5"><span class="head-part">${n1}</span><span class="red-tail">${n2}</span></div><div class="db-date">${date}</div></div>`}html+='</div>'}weekContainer.innerHTML=html;updateLightCounter()}function updateLightCounter(){const count=$$(".grid-cell.cell-lit[data-week]").length;$("week-counter").textContent=TOTAL_WEEKS+" TUẦN · "+count+" Ô SÁNG"}function clearLightCells(){$$(".grid-cell.cell-lit[data-week]").forEach(cell=>{cell.classList.remove("cell-lit");cell.setAttribute("aria-pressed","false")});updateLightCounter();$("bridge-status").textContent="Đã tắt toàn bộ ô sáng."}function toggleCellLight(cell){const active=cell.classList.toggle("cell-lit");cell.setAttribute("aria-pressed",active?"true":"false");const week=Number(cell.getAttribute("data-week"))+1;const day=Number(cell.getAttribute("data-day"))+1;const tail=cell.getAttribute("data-tail");$("bridge-status").textContent=(active?"Đã bật sáng: ":"Đã tắt sáng: ")+`tuần ${week}, cột ${day}, đuôi ${tail}.`;updateLightCounter()}function clearBridgePath(){currentBridgeRunId++;latestBridgePath=[];$$('.grid-cell.path-hit').forEach(cell=>cell.classList.remove('path-hit'));$("bridge-shadow").setAttribute("d","");$("bridge-main").setAttribute("d","");$("bridge-pulse").setAttribute("d","");$("bridge-nodes").innerHTML="";$("bridge-label").style.display="none";$("btn-auto-bridge").classList.remove("running")}function getCellByPoint(point){return document.querySelector(`.grid-cell[data-week="${point.week}"][data-day="${point.day}"]`)}function getCellCenterInStage(cell){const stage=$("grid-stage");const stageRect=stage.getBoundingClientRect();const cellRect=cell.getBoundingClientRect();return{x:cellRect.left-stageRect.left+cellRect.width/2,y:cellRect.top-stageRect.top+cellRect.height/2}}function buildSmoothPath(points){if(!points.length)return"";let d=`M ${points[0].x} ${points[0].y}`;for(let i=1;i<points.length;i++){const prev=points[i-1];const cur=points[i];const midX=(prev.x+cur.x)/2;d+=` Q ${midX} ${prev.y}, ${cur.x} ${cur.y}`}return d}function drawBridgePath(pathPoints,options={}){clearBridgePath();currentBridgeRunId++;const runId=currentBridgeRunId;const validPoints=pathPoints.map(point=>({week:Number(point.week),day:Number(point.day)})).filter(point=>Number.isInteger(point.week)&&Number.isInteger(point.day)&&point.week>=0&&point.week<TOTAL_WEEKS&&point.day>=0&&point.day<7);if(validPoints.length<2){App.toast("Cần ít nhất 2 vị trí để vẽ đường cầu.","warn");return false}latestBridgePath=validPoints.slice();const centers=[];validPoints.forEach(point=>{const cell=getCellByPoint(point);if(!cell)return;cell.classList.add("path-hit");centers.push(getCellCenterInStage(cell))});if(centers.length<2){App.toast("Không tìm thấy ô hợp lệ để vẽ.","warn");return false}const d=buildSmoothPath(centers);const shadow=$("bridge-shadow");const main=$("bridge-main");const pulse=$("bridge-pulse");shadow.setAttribute("d",d);main.setAttribute("d",d);pulse.setAttribute("d",d);main.style.animation="none";void main.offsetWidth;main.style.animation="drawBridge 1.05s cubic-bezier(.25,.9,.25,1) forwards";const nodeWrap=$("bridge-nodes");nodeWrap.innerHTML="";centers.forEach((center,index)=>{if(runId!==currentBridgeRunId)return;const node=document.createElement("div");node.className="bridge-node";node.style.left=center.x+"px";node.style.top=center.y+"px";node.style.animationDelay=(index*90)+"ms";nodeWrap.appendChild(node)});const label=$("bridge-label");const last=centers[centers.length-1];label.style.left=last.x+"px";label.style.top=(last.y-14)+"px";label.style.display="block";label.textContent=options.label||`CẦU ${centers.length} ĐIỂM`;$("bridge-status").textContent=`Đã vẽ ${centers.length} điểm trên bảng 100 tuần.`;App.toast("Đã vẽ đường cầu trên bảng tuần.","success");return true}function generateMockBridgePath(){const length=Math.floor(Math.random()*3)+3;const startWeek=Math.floor(Math.random()*86)+2;const startDay=Math.floor(Math.random()*4);const styles=["diagonal","zigzag","vertical-shift","nearby"];const style=styles[Math.floor(Math.random()*styles.length)];const path=[];for(let i=0;i<length;i++){let week=startWeek+i;let day=startDay+i;if(style==="zigzag"){day=startDay+(i%2===0?0:2)+Math.floor(i/2)}if(style==="vertical-shift"){week=startWeek+i*2;day=startDay+(i%3)}if(style==="nearby"){week=startWeek+i;day=startDay+Math.round(Math.sin(i)*2)}week=Math.max(0,Math.min(TOTAL_WEEKS-1,week));day=Math.max(0,Math.min(6,day));path.push({week,day})}return path}async function runAutoBridge(){currentBridgeRunId++;const runId=currentBridgeRunId;const btn=$("btn-auto-bridge");btn.classList.add("running");$("bridge-status").textContent="Đang quét vị trí mô phỏng trên bảng tuần...";clearBridgePath();const scanCells=$$(".grid-cell[data-week]").sort(()=>Math.random()-.5).slice(0,20);for(const cell of scanCells){if(runId!==currentBridgeRunId)return;cell.classList.add("path-hit");await new Promise(resolve=>setTimeout(resolve,35));cell.classList.remove("path-hit")}if(runId!==currentBridgeRunId)return;const mockPath=generateMockBridgePath();drawBridgePath(mockPath,{label:`CẦU ${mockPath.length} ĐIỂM`});btn.classList.remove("running")}function sendBridgeToNextSpace(){if(!latestBridgePath.length){App.toast("Chưa có đường cầu để chuyển.","warn");return}const event=new CustomEvent("weekly-db:send-bridge",{bubbles:true,composed:true,detail:{from:"weekly-db-space",type:"bridge-path",path:latestBridgePath.slice(),note:"Đường cầu mô phỏng chờ không gian kế tiếp xử lý."}});window.dispatchEvent(event);document.dispatchEvent(event);App.toast("Đã phát sự kiện chuyển đường cầu.","success")}function setupBridgeAPI(){window.WeeklyDBBridge={drawPath(points,options={}){return drawBridgePath(points,options)},clearPath(){clearBridgePath();return true},autoDemo(){runAutoBridge();return true},getLatestPath(){return latestBridgePath.slice()},clearLights(){clearLightCells();return true}}}function bindEvents(){$("btn-auto-bridge").addEventListener("click",runAutoBridge);$("btn-send-bridge").addEventListener("click",sendBridgeToNextSpace);$("btn-clear-light").addEventListener("click",clearLightCells);$("grid-scroll").addEventListener("scroll",()=>{if(latestBridgePath.length){drawBridgePath(latestBridgePath,{label:`CẦU ${latestBridgePath.length} ĐIỂM`})}});window.addEventListener("resize",()=>{if(latestBridgePath.length){drawBridgePath(latestBridgePath,{label:`CẦU ${latestBridgePath.length} ĐIỂM`})}});$("weekly-grid-content").addEventListener("click",event=>{const cell=event.target.closest(".grid-cell[data-week]");if(!cell)return;toggleCellLight(cell)});$("weekly-grid-content").addEventListener("keydown",event=>{if(event.key!=="Enter"&&event.key!==" ")return;const cell=event.target.closest(".grid-cell[data-week]");if(!cell)return;event.preventDefault();toggleCellLight(cell)})}document.addEventListener("DOMContentLoaded",()=>{renderWeeklyGrid();setupBridgeAPI();bindEvents();$("bridge-status").textContent="Sẵn sàng. Chạm một ô để bật sáng, chạm lại để tắt."});
</script>
</body>
</html>
